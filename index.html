<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暖心爱心文案</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f7, #ffeef2);
        overflow-x: hidden;
        position: relative;
    }
    .item {
        position: absolute;
        width: 110px;
        height: 90px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        color: #222;
        font-weight: 500;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        user-select: none;
        opacity: 0;
    }
</style>
</head>
<body>

<script>
// 关心语句库
const texts = [
    "你超棒的✨", "要开心呀", "记得照顾自己", "你值得被爱",
    "累了就休息", "你很重要", "平安喜乐", "万事顺意",
    "别太辛苦", "每天都顺利", "保持微笑", "一切都会好",
    "你超可爱", "好好吃饭", "好好睡觉", "永远被偏爱",
    "生活温柔", "未来可期", "不必焦虑", "有人守护你",
    "好运常在", "快乐加倍", "岁岁无忧", "平安健康"
];

// 随机颜色库
const colors = [
    "#f8bbd0", "#ce93d8", "#90caf9", "#81d4fa", "#a5d6a7",
    "#fff59d", "#ffcc80", "#ffab91", "#b2ebf2", "#d1c4e9"
];

// 生成爱心轨迹坐标
function createHeartPoints(count) {
    let points = [];
    for (let i = 0; i < count; i++) {
        let t = (i / count) * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        points.push({ x: -x * 12, y: -y * 12 });
    }
    return points;
}

// 初始化元素：从屏幕随机位置生成，然后飞入爱心位置
function createItems() {
    const total = 40;
    const points = createHeartPoints(total);
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < total; i++) {
        const div = document.createElement("div");
        div.classList.add("item");
        div.innerText = texts[i % texts.length];
        div.style.background = colors[i % colors.length];

        // 初始位置：屏幕随机角落
        const startX = Math.random() * (window.innerWidth - 120);
        const startY = Math.random() * (window.innerHeight - 100);
        div.style.left = `${startX}px`;
        div.style.top = `${startY}px`;
        div.style.opacity = "1";

        // 目标位置：爱心轨迹上的点
        const targetX = centerX + points[i].x;
        const targetY = centerY + points[i].y;

        document.body.appendChild(div);

        // 延迟不同时间，依次飞入爱心，效果更自然
        setTimeout(() => {
            div.style.left = `${targetX}px`;
            div.style.top = `${targetY}px`;
        }, i * 40);
    }
}

// 爱心拼成后2秒，随机散落全屏
function scatter() {
    const items = document.querySelectorAll(".item");
    items.forEach(item => {
        item.style.left = `${Math.random() * (window.innerWidth - 120)}px`;
        item.style.top = `${Math.random() * (window.innerHeight - 100)}px`;
    });
}

// 执行顺序：生成元素 → 飞入爱心 → 2秒后散落
createItems();
setTimeout(scatter, 40 * 40 + 2000);
</script>

</body>
</html>
